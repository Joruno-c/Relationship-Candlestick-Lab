# Python package metadata and runtime dependencies; install from the repository root.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relationship-candlestick-lab"
version = "0.1.0"
description = "Visualize chat interactions and group collaboration with reproducible candlestick charts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RCL Authors"}]
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "click>=8.1",
    "python-dateutil>=2.8",
    "PyYAML>=6.0",
    "plotly>=5.18",
    "anthropic>=0.40",
    "openai>=1.30",
    "httpx>=0.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Editable development installation: python -m pip install -e ".[test]"
test = ["pytest>=7.4"]

[project.scripts]
# CLI entry point; frontend/ and config/ remain alongside the source checkout.
relationship-candlestick = "relationship_candlestick.cli:main"

[tool.setuptools.packages.find]
include = ["relationship_candlestick*"]
